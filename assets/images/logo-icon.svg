<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="iconHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="iconPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sleek Squircle Glass Container -->
  <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#iconBgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />

  <!-- Heart Body -->
  <path d="M24 37 C14 29.5 9.5 22.8 9.5 16 C9.5 11.2 13.2 7.5 18 7.5 C21 7.5 23.2 9 24 10.8 C24.8 9 27 7.5 30 7.5 C34.8 7.5 38.5 11.2 38.5 16 C38.5 22.8 34 29.5 24 37 Z"
        fill="url(#iconHeartGrad)" filter="url(#iconGlow)" />

  <!-- Digital Pulse Line -->
  <path d="M11 21 L17 21 L20 15 L23 27 L26 17 L29 23 L32 21 L37 21"
        fill="none" stroke="url(#iconPulseGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Signal Sparks -->
  <circle cx="23" cy="27" r="1.8" fill="#ffffff" />
  <circle cx="26" cy="17" r="1.4" fill="#38bdf8" />
</svg>
