<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="logoHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="logoPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="logoTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="12" fill="url(#logoTileGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />
    <!-- Heart Body -->
    <path d="M20 31 C11.5 24.5 7.5 18.8 7.5 13 C7.5 8.8 10.7 5.5 14.8 5.5 C17.4 5.5 19.3 6.8 20 8.4 C20.7 6.8 22.6 5.5 25.2 5.5 C29.3 5.5 32.5 8.8 32.5 13 C32.5 18.8 28.5 24.5 20 31 Z"
          fill="url(#logoHeartGrad)" filter="url(#logoGlow)" />
    <!-- Pulse Line -->
    <path d="M9 17.5 L14 17.5 L16.5 12 L19 23 L22 14 L24.5 19.5 L27 17.5 L31 17.5"
          fill="none" stroke="url(#logoPulseGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="19" cy="23" r="1.5" fill="#ffffff" />
    <circle cx="22" cy="14" r="1.2" fill="#38bdf8" />
  </g>

  <!-- Typography: "iLoveDigital" -->
  <text x="56" y="27" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.3">
    iLove<tspan font-weight="800" fill="url(#logoTextGrad)">Digital</tspan>
  </text>

  <!-- Tagline: "CREATOR STUDIO" -->
  <text x="57" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="2.2">
    CREATOR STUDIO
  </text>
</svg>
