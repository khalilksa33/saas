<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <!-- Primary Heart & Pulse Gradient -->
    <linearGradient id="heartGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="backGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Behind Heart -->
  <path d="M32 49 C18 39 12 30 12 21 C12 14.5 17 9.5 23.5 9.5 C27.5 9.5 30.5 11.5 32 14 C33.5 11.5 36.5 9.5 40.5 9.5 C47 9.5 52 14.5 52 21 C52 30 46 39 32 49 Z"
        fill="url(#heartGrad)" opacity="0.3" filter="url(#backGlow)" />

  <!-- Stylized Digital Heart Geometry -->
  <path d="M32 48.5 C19 39 13.5 30.5 13.5 22 C13.5 16 18 11.5 24 11.5 C27.8 11.5 30.6 13.5 32 15.8 C33.4 13.5 36.2 11.5 40 11.5 C46 11.5 50.5 16 50.5 22 C50.5 30.5 45 39 32 48.5 Z"
        fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Digital Pulse Line Through Center -->
  <path d="M15 28 L23 28 L27 21 L31 35 L35 23 L39 31 L43 28 L49 28"
        fill="none" stroke="url(#pulseGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radiant Center Energy Spark -->
  <circle cx="31" cy="35" r="2.2" fill="#ffffff" filter="url(#glow)" />
  <circle cx="35" cy="23" r="1.8" fill="#38bdf8" />
</svg>
