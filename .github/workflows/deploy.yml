name: 🚀 Deploy iLoveDigital SaaS to Hostinger (ilovedigital.online)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  web-deploy:
    name: 📦 Sync Files to Hostinger (ilovedigital.online)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Sync Files to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'public_html' }}
        run: |
          python3 scripts/deploy_hostinger.py

      - name: 🌐 Verify Live Site Response
        run: |
          echo "Waiting 5 seconds for web server cache..."
          sleep 5
          echo "Testing https://ilovedigital.online response:"
          curl -s -L -k https://ilovedigital.online | grep -i "iLoveDigital" && echo "✅ SUCCESS: ilovedigital.online is live and serving iLoveDigital SaaS!" || (echo "Notice: Checking headers" && curl -I -k https://ilovedigital.online)
