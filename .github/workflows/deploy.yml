name: 🚀 Deploy CreatorPulse SaaS to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  web-deploy:
    name: 📦 Sync Files to Hostinger Subdomain (tools/)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Sync Files to Hostinger Subdomain
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'tools' }}
        run: |
          python3 scripts/deploy_hostinger.py
